# nginx site for the TextEnhanceAI relay behind an existing nginx.
#   cp nginx-site.example.conf /etc/nginx/sites-available/relay.conf
#   ln -s /etc/nginx/sites-available/relay.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d relay.example.com --key-type rsa
#
# --key-type rsa keeps the chain on ISRG Root X1: Python on Windows often fails
# to verify Let's Encrypt's ECDSA chain because of a stale intermediate in the
# Windows certificate store (TextEnhanceAI itself works around this, other
# OpenAI-compatible clients may not).
#
# Buffering must stay off (SSE streams) and the read timeout long (agent
# WebSockets); do not wrap this in a generic proxy snippet that sets
# proxy_buffering on or a 60 s proxy_read_timeout.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
